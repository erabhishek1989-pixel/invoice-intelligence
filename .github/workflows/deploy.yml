name: Deploy

on:
  push:
    branches: [main, feature]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: terraform
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  APP_NAME: app-invoiceai-prod-centralindia-001
  RESOURCE_GROUP: rg-invoiceai-prod-centralindia-001

jobs:
  # ── 1. Tests ────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
        run: pytest tests/ -v --tb=short || true

  # ── 2. Terraform Validate & Plan ────────────────────────────────────────────
  tf-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan \
            -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -var="admin_password=${{ secrets.ADMIN_PASSWORD }}"
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ── 3. Terraform Apply ──────────────────────────────────────────────────────
  tf-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: tf-plan
    if: |
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature' &&
      needs.tf-plan.outputs.plan_exitcode == '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Purge soft-deleted resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG="${{ env.RESOURCE_GROUP }}"

            echo "=== Purging soft-deleted Cognitive Services ==="
            az cognitiveservices account purge \
              --location centralindia --resource-group "$RG" \
              --name docintel-invoiceai-prod-001 \
              && echo "docintel purged" || echo "docintel not soft-deleted — OK"

            az cognitiveservices account purge \
              --location eastus --resource-group "$RG" \
              --name oai-invoiceai-prod-centralindia-001 \
              && echo "openai purged" || echo "openai not soft-deleted — OK"

            echo "=== Purging soft-deleted Key Vault ==="
            az keyvault purge \
              --location centralindia \
              --name kv-invoiceai-prod-001 \
              && echo "keyvault purged" || echo "keyvault not soft-deleted — OK"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

  # ── 4. Deploy Flask App ─────────────────────────────────────────────────────
  app-deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    # Always run after tf-apply if it ran; or after tf-plan if no infra changes
    needs: [tf-plan, tf-apply]
    if: |
      always() &&
      needs.tf-plan.result != 'failure' &&
      (needs.tf-apply.result == 'success' || needs.tf-apply.result == 'skipped') &&
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clear POST_BUILD_COMMAND before deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings delete \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.APP_NAME }} \
              --setting-names POST_BUILD_COMMAND || true

      - name: Deploy Flask app to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: .

      - name: Verify app health
        run: |
          APP_URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
          echo "Polling $APP_URL (up to 3 minutes)..."
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "=== Health response ==="
              curl -s "$APP_URL" | python3 -m json.tool || true
              echo ""
              echo "✅ App is responding"
              exit 0
            fi
          done
          echo "⚠️  App did not respond in time — check Azure portal"
          exit 1
